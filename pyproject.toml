[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph-prototype"
version = "0.0.1"
description = "An experiment in version control for agent work"
requires-python = ">=3.11"

[project.scripts]
workgraph = "workgraph.cli:main"

[tool.setuptools.packages.find]
include = ["workgraph*"]
