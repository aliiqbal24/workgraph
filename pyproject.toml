[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph-agent"
version = "1.1.0"
description = "Explore saved project versions, keep every direction, and continue with agents"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[project.scripts]
workgraph = "workgraph.cli:main"

[tool.setuptools.packages.find]
include = ["workgraph*"]

[tool.setuptools.package-data]
workgraph = ["web/*.html", "web/*.css", "web/*.js"]
