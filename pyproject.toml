[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workgraph-agent"
version = "1.0.0"
description = "Persistent engineering work across agent sessions"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

[project.scripts]
workgraph = "workgraph.cli:main"

[tool.setuptools.packages.find]
include = ["workgraph*"]

[tool.setuptools.package-data]
workgraph = ["web/*.html", "web/*.css", "web/*.js"]
