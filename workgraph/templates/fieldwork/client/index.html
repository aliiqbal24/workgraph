<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldwork — a little room for good work</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><aside id="sidebar"></aside><main id="workspace"></main><div id="detail"></div><dialog id="new-issue"><form id="issue-form"><span class="eyebrow">SOMETHING WORTH WORKING ON</span><h2>A little idea, a place to start.</h2><label for="issue-title">Issue title</label><input id="issue-title" name="title" placeholder="What would you like to work on?" required maxlength="180"><label for="issue-description">A little context</label><textarea id="issue-description" name="description" placeholder="What would make this feel done?"></textarea><div class="form-actions"><button type="button" id="cancel-issue">Cancel</button><button class="primary" type="submit">Create issue</button></div></form></dialog><div id="app-toast" role="status"></div></body></html>
