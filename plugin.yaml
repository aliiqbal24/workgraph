name: workgraph
version: "1.1.0"
description: Explore saved versions, branch from any point, compare outcomes, combine selected changes, and continue with agents. Local visual workspace, native capture, and Git-compatible checked acceptance.
author: Workgraph contributors
requires_hermes: ">=0.21.0"
provides_tools:
  - workgraph
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_finalize
provides_middleware:
  - tool_request
  - tool_execution
provides_skills:
  - workgraph
config_schema:
  repository:
    type: string
    description: Path to an initialized local Workgraph repository. The launcher also supplies this through WORKGRAPH_REPO.
