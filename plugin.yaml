name: workgraph
version: "1.0.0"
description: Persistent work for agents. Isolated attempts, automatic checkpoints, portable handoffs, exact dependencies, and checked Git-compatible candidates.
author: Workgraph contributors
requires_hermes: ">=0.21.0"
provides_tools:
  - workgraph
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_finalize
provides_middleware:
  - tool_request
  - tool_execution
provides_skills:
  - workgraph
config_schema:
  repository:
    type: string
    description: Path to an initialized local Workgraph repository. The launcher also supplies this through WORKGRAPH_REPO.
